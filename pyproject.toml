[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bluetooth-sniffle"
version = "0.1.0"
description = "Python testbed framework coordinating Sniffle-enabled USB devices for BLE tracking research"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Bluetooth Sniffle Team" },
]
dependencies = [
    "pyserial>=3.5",
    "cryptography>=40.0.0",
    "pydantic>=2.0.0",
    "sniffle",
    "pytest>=9.1.1",
    "matplotlib>=3.10.9",
]

[project.scripts]
bluetooth-sniffle = "bluetooth_sniffle.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["sniffle*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["src/sniffle", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.uv.workspace]
members = [
    "src/sniffle",
]

[tool.uv.sources]
sniffle = { workspace = true }


